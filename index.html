<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Gestión de Cosechas</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="dark">

    <header>

        <button id="btnTema" class="boton-tema">
            🌙
        </button>


        <h1>
            Sistema de Gestión de Cosechas
        </h1>


        <p>
            Control inteligente de ciclos de cosechas
        </p>

    </header>


    <main class="contenedor">


        <!--=====================================
                    PANEL SUPERIOR
        ======================================-->

        <section class="panel">

            <div class="grupo">

                <label for="ciclo">
                    Seleccione un ciclo
                </label>

                <select id="ciclo">

                    <option value="">
                        -- Seleccione --
                    </option>


                    <option value="1F">
                        1F
                    </option>


                    <option value="2F">
                        2F
                    </option>


                    <option value="3F">
                        3F
                    </option>


                    <option value="ETAPA5">
                        ETAPA 5
                    </option>


                </select>

            </div>


            <div class="grupo">

                <label for="buscar">

                    Buscar

                </label>

                <input
                    type="text"
                    id="buscar"
                    placeholder="Buscar..."
                >

            </div>

        </section>



        <!--=====================================
                    DASHBOARD
        ======================================-->

        <section id="dashboard">

            <div class="card card-total"
            onclick="filtrarEstado('TODOS')">

                <i class="fa-solid fa-table-list"></i>

                <span id="totalRegistros">0</span>

                <h3>Total</h3>

            </div>

            <div class="card card-finalizadas"
            onclick="filtrarEstado('FINALIZADA')">

                <i class="fa-solid fa-circle-check"></i>

                <span id="totalFinalizadas">0</span>

                <h3>Finalizadas</h3>

            </div>

            <div class="card card-curso"
            onclick="filtrarEstado('EN CURSO')">

                <i class="fa-solid fa-hourglass-half"></i>

                <span id="totalCurso">0</span>

                <h3>En curso</h3>

            </div>

            <div class="card card-proximas"
            onclick="filtrarEstado('PROXIMA')">

                <i class="fa-solid fa-calendar-days"></i>

                <span id="totalProximas">0</span>

                <h3>Próximas</h3>

            </div>

        </section>



        <!--=====================================
                    INFORMACION
        ======================================-->

        <section id="informacion">

            <div class="info">

                <strong>Fecha actual:</strong>

                <span id="fechaActual">

                    --

                </span>

            </div>

            <div class="info">

                <strong>Ciclo:</strong>

                <span id="nombreCiclo">

                    --

                </span>

            </div>

        </section>



        <!--=====================================
                    TABLA
        ======================================-->

        <section id="tablaContainer">

            <div class="mensaje">

                Seleccione un ciclo para comenzar.

            </div>

        </section>


    </main>


    <!--=====================================
                LIBRERIA XLSX
    ======================================-->

    <script src="libs/xlsx.full.min.js"></script>


    <!--=====================================
                ARCHIVOS JS
    ======================================-->

    <script src="js/config.js"></script>
    <script src="js/motorReglas.js"></script>
    <script src="js/calendario.js"></script>
    <script src="js/estados.js"></script>
    <script src="js/excel.js"></script>
    <script src="js/tabla.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/filtros.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/cicloActivo.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
